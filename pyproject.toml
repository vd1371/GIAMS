[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giams"
version = "0.1.0"
description = "General Infrastructure Asset Management Systems — open-source, extensible, modular platform for asset management at project- and network-levels."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "GIAMS Contributors" }
]
keywords = ["infrastructure", "asset-management", "life-cycle", "optimization", "bridges"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "scipy>=1.7",
    "deap>=1.3",
    "pyswarms>=1.3",
    "ruff>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["Asset", "Examples", "LifeCycleAnalyzer", "Network", "Optimizer", "RLEnvs", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
